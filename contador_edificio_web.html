<script>
const objetivo = Date.parse("2026-09-08T08:00:00+02:00");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

function actualizar(){
  let ms = objetivo - Date.now();
  if(ms <= 0){
    $("timer").innerHTML='<div id="finished">🎉 ¡YA!</div>';
    return;
  }
  let total=Math.floor(ms/1000);
  let dias=Math.floor(total/86400);
  let horas=Math.floor((total%86400)/3600);
  let minutos=Math.floor((total%3600)/60);
  let segundos=total%60;
  $("d").textContent=pad(dias);
  $("h").textContent=pad(horas);
  $("m").textContent=pad(minutos);
  $("s").textContent=pad(segundos);
}
actualizar();
setInterval(actualizar,1000);
</script>
